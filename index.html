<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Goose</title>
<meta name="description" content="Build multimedia scavenger hunts, guided tours and quizzes. One file, no account, no server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;family=Spectral:ital,wght@0,400;0,600;1,400;1,600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#08304C; --ink-soft:#3A6A8C; --paper:#FBFAF7;
  --shoal:#DCEAF3; --shoal-deep:#B6D2E4; --sand:#FFF6CC;
  --accent:#0068A7; --accent-tint:#E2F0F9; --accent-dark:#00537F;
  --gold:#FFE01B; --gold-deep:#D9BC00;
  --rule:#BFD5E2; --ok:#1F6B4F; --ok-bg:#DDEDE4; --warn:#8A4B0B; --warn-bg:#F7E9DC;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Barlow Semi Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.45; -webkit-text-size-adjust:100%; min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='300' viewBox='0 0 420 300'><g fill='none' stroke='%2308304C' stroke-opacity='0.07' stroke-width='1'><path d='M-20 60 C 80 10, 180 110, 300 50 S 460 30, 480 90'/><path d='M-20 110 C 90 60, 190 160, 310 100 S 460 80, 480 140'/><path d='M-20 170 C 100 120, 200 220, 320 160 S 460 140, 480 200'/><path d='M-20 240 C 110 190, 210 290, 330 230 S 460 210, 480 270'/></g></svg>");
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px 90px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15}
.placename{font-family:Spectral,Georgia,"Times New Roman",serif;font-style:italic;font-weight:600}
.lede{font-size:1.05rem;color:var(--ink-soft);max-width:62ch}
.tiny{font-size:.86rem;color:var(--ink-soft)}
a{color:var(--accent)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--shoal);padding:1px 4px;border-radius:2px}

.masthead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 0 14px;border-bottom:2px solid var(--ink)}
.mark{display:flex;align-items:center;gap:9px;font-size:1.15rem;font-weight:700}
.masthead .spacer{flex:1}

button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;min-height:44px;
  border:1.5px solid var(--ink);border-radius:var(--r);background:var(--paper);color:var(--ink);font-weight:600;
  cursor:pointer;text-decoration:none}
.btn:hover{background:var(--shoal)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#143252}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.go:hover{background:var(--accent-dark)}
.btn.quiet{border-color:var(--rule);font-weight:500}
.btn.quiet:hover{background:var(--shoal)}
.btn.danger{border-color:var(--rule);color:var(--warn);font-weight:500}
.btn.danger:hover{background:var(--warn-bg)}
.btn.big{font-size:1.1rem;padding:14px 22px;min-height:54px;width:100%}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

label{display:block;font-size:.9rem;font-weight:600;margin:0 0 5px}
.field{margin:0 0 16px}
input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--rule);
  border-radius:var(--r);padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.hint{font-size:.85rem;color:var(--ink-soft);margin:4px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inline{display:flex;align-items:center;gap:8px}
.inline label{margin:0;font-weight:500}
.check{display:flex;align-items:center;gap:8px;min-height:40px}
.check input{accent-color:var(--accent);width:20px;height:20px;flex:none}
.check label{margin:0;font-weight:500}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{margin:0;display:flex;align-items:center;gap:7px;padding:8px 12px;min-height:42px;
  border:1.5px solid var(--rule);border-radius:var(--r);cursor:pointer;font-weight:500;background:#fff}
.pills input{accent-color:var(--accent);margin:0}
.pills label:has(input:checked){border-color:var(--ink);background:var(--shoal);font-weight:600}
.pills label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

.build-grid{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start;margin-top:22px}
.ellist{border-top:1px solid var(--rule)}
.ellist ol{margin:0;padding:0}
.ellist li{list-style:none}
.elrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 8px;background:none;
  border:0;border-bottom:1px solid var(--rule);cursor:pointer;min-height:46px}
.elrow:hover{background:var(--shoal)}
.elrow.on{background:var(--ink);color:var(--paper)}
.elrow.on .glyph{border-color:var(--paper);color:var(--paper)}
.elrow:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.elrow.sect{background:var(--sand);font-weight:700;border-bottom:1.5px solid var(--ink-soft)}
.elrow.sect.on{background:var(--ink)}
.elrow.indent{padding-left:22px}
.glyph{flex:none;width:24px;height:24px;border:1.5px solid currentColor;border-radius:var(--r);
  display:grid;place-items:center;font-size:.72rem;font-weight:700}
.elname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elmeta{flex:none;font-size:.76rem;opacity:.75}

.panel{border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;padding:20px}
.panel + .panel{margin-top:18px}
.panelhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--rule)}
.panelhead h2{font-size:1.3rem}
.panelhead .spacer{flex:1}
.sub{border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin:0 0 16px;background:#FCFDFD}
.sub > h3{font-size:1rem;margin:0 0 10px}

.tabs{display:flex;gap:0;margin:18px 0 0;border-bottom:2px solid var(--ink);overflow-x:auto}
.tab{padding:10px 15px;min-height:44px;background:none;border:0;border-bottom:4px solid transparent;
  margin-bottom:-3px;cursor:pointer;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}

.empty{border:1.5px dashed var(--rule);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--ink-soft)}
.empty p{margin:0 0 14px}

.addmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.addmenu button{text-align:left;padding:10px 12px;border:1.5px solid var(--rule);border-radius:var(--r);
  background:#fff;cursor:pointer;min-height:56px}
.addmenu button:hover{border-color:var(--ink);background:var(--shoal)}
.addmenu b{display:block;font-size:.98rem}
.addmenu span{font-size:.8rem;color:var(--ink-soft)}

/* ---- player ---- */
.play-wrap{max-width:660px;margin:0 auto}
.punch{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.pip{width:18px;height:18px;transform:rotate(45deg);border:1.5px solid var(--ink-soft);flex:none}
.pip.done{background:var(--gold);border-color:var(--gold-deep);position:relative}
.pip.done::after{content:"";position:absolute;inset:4px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-90deg) scale(.9)}
.pip.miss{background:var(--warn-bg);border-color:var(--warn)}
.pip.now{border-color:var(--accent);border-width:2.5px;box-shadow:0 0 0 3px var(--accent-tint)}
.stage{border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:22px;margin:16px 0 0}
.stage h2{font-size:1.55rem}
.stagehead{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.body{font-size:1.15rem;line-height:1.5;white-space:pre-wrap;margin:12px 0 0}
.media{margin:16px 0 0}
.media img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:var(--r)}
.media audio,.media video{width:100%;margin-top:10px;display:block}
.media figcaption{font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.answerbox{margin:20px 0 0;padding:18px 0 0;border-top:1px solid var(--rule)}
.answerbox input[type=text]{font-size:1.15rem;min-height:52px}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1.5px solid var(--rule);
  border-radius:var(--r);background:#fff;cursor:pointer;text-align:left;min-height:50px;width:100%}
.choice:hover{border-color:var(--ink);background:var(--shoal)}
.choice.picked{border-color:var(--accent);background:var(--accent-tint);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--warn);background:var(--warn-bg)}
.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.orderlist{display:grid;gap:7px}
.orderrow{display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:var(--r);
  padding:8px 10px;background:#fff;min-height:50px}
.orderrow .txt{flex:1}
.spotwrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;touch-action:manipulation}
.spotwrap img{display:block;max-width:100%;height:auto;border:1.5px solid var(--rule);border-radius:var(--r)}
.marker{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid var(--accent);
  border-radius:50%;background:rgba(181,23,92,.22);pointer-events:none}
.marker.target{border-color:var(--ok);background:rgba(31,107,79,.2)}
.flash{margin:14px 0 0;padding:12px 14px;border-radius:var(--r);border-left:5px solid var(--rule);
  background:var(--shoal);font-weight:600;white-space:pre-wrap}
.flash.bad{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.flash.good{border-left-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.flash.info{border-left-color:var(--accent);background:var(--accent-tint);color:var(--accent-dark)}
.scorebar{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin:12px 0 0;font-size:.95rem;color:var(--ink-soft)}
.scorebar b{font-size:1.2rem;color:var(--ink);font-weight:700}
.countdown{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.countdown.low{color:var(--warn)}
#map{height:280px;border:1.5px solid var(--ink);border-radius:var(--r);margin:16px 0 0}
.compass{display:flex;align-items:center;gap:16px;margin:16px 0 0;padding:14px;border:1.5px solid var(--rule);border-radius:var(--r)}
.needle{width:74px;height:74px;flex:none;border:2px solid var(--ink);border-radius:50%;position:relative;background:#fff}
.needle i{position:absolute;left:50%;top:50%;width:0;height:0;margin-left:-9px;margin-top:-30px;
  border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:30px solid var(--accent);
  transform-origin:50% 100%;transition:transform .18s linear}
.dist{font-size:1.6rem;font-weight:700;line-height:1}
.finish{text-align:center;padding:26px 20px}
.finish .bignum{font-family:Spectral,Georgia,serif;font-size:4rem;line-height:1;font-weight:600;display:inline-block;background:var(--gold);color:var(--ink);padding:6px 26px;border-radius:var(--r)}
.linkbox{display:block;width:100%;font-size:.82rem;word-break:break-all;background:var(--shoal);
  border:1px solid var(--shoal-deep);border-radius:var(--r);padding:12px;max-height:130px;overflow:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace}
#qrbox{margin:16px 0 0;display:flex;justify-content:center}
#qrbox img,#qrbox canvas{border:10px solid #fff;outline:1px solid var(--rule)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:18px 0 0}
.card{border:2px dashed var(--ink-soft);border-radius:var(--r);padding:16px;text-align:center;background:#fff}
.card .code{font-size:1.8rem;font-weight:700;letter-spacing:.05em;margin:8px 0 0;word-break:break-word}
.card .qr{margin:12px auto 0;width:132px}
.card .qr img,.card .qr canvas{width:100%;height:auto}
table.grid{width:100%;border-collapse:collapse;margin-top:14px;font-size:.95rem}
table.grid th,table.grid td{border-bottom:1px solid var(--rule);padding:9px 8px;text-align:left}
table.grid th{font-size:.85rem;color:var(--ink-soft)}
table.grid tr.top td{background:var(--accent-tint);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:78px;height:78px;object-fit:cover;border:1px solid var(--rule);border-radius:var(--r)}
.scan{position:relative;margin-top:14px}
.scan video{width:100%;border:1.5px solid var(--ink);border-radius:var(--r);background:#000;display:block}
@media print{
  body::before,.masthead,.tabs,.noprint{display:none !important}
  body{background:#fff;font-size:12pt}
  .wrap{max-width:none;padding:0}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card{break-inside:avoid;page-break-inside:avoid}
}
@media (max-width:860px){
  .build-grid{grid-template-columns:1fr;gap:18px}
  .two,.three{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.brandmark{height:34px;width:auto;display:block;flex:none}
.sitefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:44px 0 0;padding:16px 0 0;
  border-top:1px solid var(--rule);color:var(--ink-soft);font-size:.85rem}
.sitefoot img{height:26px;width:auto;flex:none}
.finish .brandblock{margin:26px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.finish .brandblock img{height:66px;width:auto}
.joinbrand{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.joinbrand img{height:46px;width:auto;flex:none}
.hidden{display:none !important}
</style>
</head>

/*HUNT_START*/window.WAYPOINT_DEFAULT = {"v":4,"title":"Szeged city game","intro":"A walk through the middle of Szeged, in fifteen stops plus a start and a finish.\n\nSome stops ask a question. Some ask you to do something slightly ridiculous and photograph it. You cannot move on until the current one is done, and you will only be told where to go next once it is.\n\nFour things before you start.\nOne: keep the phone's location switched on, and keep this tab open.\nTwo: nobody has to do anything they are not comfortable with — swap the job to someone else in the team and carry on. The point is that someone from your team does it.\nThree: look up more than you look down. That is rather the point.\nFour: when you reach the finish, download your results before you do anything else.\n\nBrought to you by the Eurotender Association, who will be sitting down for the next three hours. You will not. No app store, no budget, and no real idea what you are about to do to a playground wheel. ","finish":"Before anything else: press Download our results on the next page. Your five photos live only on this phone and only until you do. There is no copy anywhere else, and no way to get them back.\n\nDone? Good. That is the whole ring. You walked the city the way it is actually built — as a set of rings and spokes laid out after the flood of 1879 washed almost all of it away.\n\nNow find your facilitators, show them the photos, and send Zsanett the file over.\n\nMade by the Eurotender Association, who chose the mayfly, and decided that running across a fountain was a reasonable thing to ask of adults. Some of those decisions were better than others. If the last three hours were good, say so. If they were not, say that too, as it is the only way the next group gets a better version.","accent":"#B5175C","minPlayers":4,"maxPlayers":6,"hintCost":5,"askNames":true,"stations":[{"id":"s00","name":"The starting line","lat":46.251247,"lng":20.141653,"radius":80,"nav":"You are already here, standing with your facilitators. Tap the button.","navAlt":"","arrive":"Nothing to find yet. This is just the start — if something is broken, now is the moment to say so, while you still have us in the room.","kind":"choice","prompt":"Are you ready?","options":[{"t":"Yes","ok":true},{"t":"No","ok":false},{"t":"Ask us again after a coffee","ok":false},{"t":"Define 'ready'","ok":false}],"answer":"","tol":0,"hint":"","reveal":"Good. From here on you are on your own.\n\nEach stop gives you a direction and a distance, not an address. Walk until the number gets small. When the app lets you in, do what it asks, and then it will tell you where to go next.\n\nYou have about two and a half hours. Do not run. Szeged is small.","points":5},{"id":"l00","name":"The man who saved more lives than any general","lat":46.250328,"lng":20.145775,"radius":45,"nav":"Head for a large open square with a fountain that students throw each other into after graduation. A university building runs down one side of it. The statue you want stands in front of that building.","navAlt":"","arrive":"The fountain is the loud part of this square. Turn your back on it and look at the man on the steps instead. He worked in the building behind you, and what he found there put him on a list with about a thousand people in all of history. Nobody is going to top that today. But there is a prize going.","kind":"photo","prompt":"{{player}} awards a Nobel Prize to somebody else in the team. It has to be for something they have genuinely done in the last hour — carried the heavy thing, spotted the answer, stopped the argument. The citation is read out loud, standing up, with full ceremony. Everybody else applauds properly. Photograph the moment of the award with the statue behind you.","options":[{"t":"Stepping down from the fourth step to the third","ok":true},{"t":"Standing squarely on the top step","ok":false},{"t":"Climbing from the first step to the second","ok":false},{"t":"Standing on the ground, not on the steps at all","ok":false}],"answer":"","tol":0,"hint":"","reveal":"Albert Szent-Györgyi. He worked here, in this building, and in 1937 he took the Nobel Prize for isolating vitamin C — which he did in quantity from Szeged paprika, because paprika was what Szeged had a lot of. He left Hungary in 1947 and never really came back.\n\nThis square is the student engine room of the city, and the fountain behind you is where graduates get thrown in every summer. The pedestrian street running off it is where Szeged does its shopping, drinking and loitering, so if you have a free evening this week, start here and walk until something looks good.","points":15},{"id":"l01","name":"The jewel of Art Nouveau","lat":46.251506,"lng":20.145394,"radius":45,"nav":"Look for the whitest, strangest, most liquid-looking building in Szeged — the one that appears to be melting upwards. It sits on a corner where a boulevard bends.","navAlt":"Your first stop, and an easy one to start with. Head east, towards the middle of town — about three hundred and fifty metres. Look for the whitest, strangest, most liquid-looking building in Szeged, the one that appears to be melting upwards. It sits on a corner where a boulevard bends.","arrive":"Stand back far enough to see the whole facade, then look at the very top corner of the building.","kind":"text","prompt":"What animal is sitting on the tip of the corner?","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"eagle|an eagle|sas|the eagle|eagles|black eagle","tol":0,"hint":"It is a bird, and it is looking down a street that is named after it.","reveal":"The Reök Palace, finished in 1907 by Ede Magyar — the architect people call the Hungarian Gaudí, and who was thirty when he built this.\n\nThe whole facade is about water: those are water lilies, and the balcony railings are meant to read as weed swirling in a current. Which is a bold thing to put on a building in a city that had been destroyed by water twenty-eight years earlier.\n\nThe eagle is not decoration. It faces, and refers to, Fekete Sas — Black Eagle — Street.\n\nYou can go inside. It is a contemporary art gallery now, open 10 to 6 every day except Monday, and the staircase alone is worth the ticket. There is also a confectionary under it, which is a very Hungarian way to treat a national monument.","points":15},{"id":"l02","name":"The dome on the west side","lat":46.253827,"lng":20.142664,"radius":50,"nav":"Go west, away from the river, into the quieter streets. You are looking for a very large dome that you will see over the rooftops before you see the building under it.","navAlt":"","arrive":"Find a spot where you can see the front of the building properly.","kind":"photo","prompt":"{{player}} conducts. The rest of you are a choir — mouths wide open, arms out, completely silent. {{player}} takes it very seriously. Ask a stranger to take a photo of the performance, with the building behind you.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"","tol":0,"hint":"","reveal":"Szeged's New Synagogue, finished in 1903 to a design by Lipót Baumhorn, who built more synagogues than any architect in Europe. It is one of the largest anywhere, and it is still in use.\n\nWe put a silent choir here on purpose. The building was designed around sound and light — the dome, the glass — for a community that was a substantial part of this city and was almost entirely destroyed in 1944. Standing here quietly is not a bad way to spend a minute.\n\nGo inside this week. It is open 9 to 4, closed Mondays and Saturdays, and there is a small entrance fee. The interior is one of the reasons people come to Szeged — blue dome, stained glass the whole way round — and it is almost never crowded. Cover your head if you are a man; they will lend you something at the door.","points":15},{"id":"l03","name":"The square with the good cake","lat":46.25214,"lng":20.147956,"radius":45,"nav":"Go towards the pedestrian heart of the city. You want a small rectangular square with a statue of a man in the middle of it, standing where the walking street widens out.","navAlt":"","arrive":"This square is the busiest crossroads of pedestrian Szeged. Which is convenient, because you are about to need a stranger.","kind":"photo","prompt":"Find someone who lives here and ask them to teach {{player}} one Hungarian word or short expression — any, their choice, not 'köszönöm'. {{player}} must then say it out loud, even if badly, three times. Take a photo of the lesson in progress, with your teacher in the frame and visibly willing.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"","tol":0,"hint":"Cafe terraces are easier than people walking somewhere. Try someone sitting down.","reveal":"Klauzál tér. In the summer of 1849, as the war of independence collapsed, Lajos Kossuth stood on a balcony on this square and gave what is remembered as his last public speech in Hungary. The statue is him.\n\nThe cake shop on the corner has been here since long before any of us. You are not required to go in. We simply mention it.\n\nFair warning: Virág is a hundred-year-old institution coasting somewhat on the reputation. The room is gorgeous, the service is unhurried to a fault, and opinions on the cake are strongly held in both directions. Order the somlói galuska, sit outside, and treat it as an experience rather than dessert. Open till 9 most nights.","points":15},{"id":"l04","name":"The bridge that goes nowhere","lat":46.2542,"lng":20.147801,"radius":45,"nav":"Keep going north along the wide walking street until it opens into the biggest square in the city — a park in the middle, grand buildings all round the edge. Find the town hall on the far side, then look at the narrow gap between it and the building next door.","navAlt":"Your first stop, and a proper walk to get there — north-east, the better part of a kilometre, straight into the middle of the city. You want the biggest square in Szeged, with a park down the middle and the town hall along one side. Then look at the narrow gap between the town hall and the building next to it.","arrive":"There is a small covered bridge up in the air, joining the town hall to its neighbour. It has no purpose you could defend in a budget meeting. It is also the most photographed thing on this square.","kind":"choice","prompt":"This little bridge borrows its nickname from a much more famous bridge in another city. Which city?","options":[{"t":"Prague","ok":false},{"t":"Vienna","ok":false},{"t":"Paris","ok":false},{"t":"Venice","ok":true}],"answer":"","tol":0,"hint":"Canals, gondolas, and a rather grimmer original: the one it is named after carried prisoners to their cells.","reveal":"The Bridge of Sighs, borrowed from Venice, where the original carried condemned prisoners from the courtroom to their cells and was named for the noise they made on the way. Szeged's version connects the town hall to the building next door, which is a considerably lower-stakes journey.\n\nIt was built for the King's Days of October 1883. Franz Joseph and his retinue slept in the building on the left and were received in the town hall on the right, and an emperor cannot simply walk fifty metres down the pavement like a man going to buy bread. So a bridge was built for one person to cross, on one day. A city four years out of catastrophe put up a decorative covered bridge for an emperor to walk across. Read that as vanity or as defiance; it is probably both.\n\nThis square is the city's living room. Everything ends up here — markets, concerts, the Christmas fair, students drinking on the grass in September. If you arrange to meet anyone in Szeged this week, meet them here and nobody will get lost.","points":15},{"id":"l05","name":"The hot tap in the street","lat":46.255819,"lng":20.148644,"radius":40,"nav":"Only a short walk from the last one, at the northern end of the same square, near the boulevard. Look for people queuing with plastic bottles.","navAlt":"","arrive":"There are four taps. Two run hot, two run cold. {{player}} has to taste the hot one and describe the flavour to the team in one word before you answer.\n(Please, do not drink more than a few sips).","kind":"choice","prompt":"Your taster has had a mouthful. One word was promised, but we will be generous. Which of these is closest?","options":[{"t":"Warm coins","ok":true},{"t":"A swimming pool with a medical degree","ok":true},{"t":"Soup that gave up halfway","ok":true},{"t":"Salt, and then regret","ok":true},{"t":"Honestly? Fine. Weirdly fine.","ok":true}],"answer":"51","tol":2,"hint":"","reveal":"Whatever they picked, they are not wrong. The Anna Well is alkaline-iodine water, thick with mineral salts, coming up from 944 metres below the city at about 51 °C. It was officially certified as medicinal in 1929.\n\nIt is named after Anna Judit Patzauer, daughter of the man who started bottling it. People come here every single day with jugs and plastic bottles, and have done for a century. Whether it tastes good is a question on which reasonable people differ violently, and your taster has now joined that argument for life.\n\nThe water is free and it is always on, so bring a bottle. The building it belongs to is the Anna Baths, two minutes up the boulevard — six pools from cold to 38 degrees, saunas, restored Art Nouveau interiors, and around €10 to get in. Open from 20:30 until midnight on Wednesdays and Fridays. After a long day of walking, this is the single best thing you can do with an evening in Szeged.","points":15},{"id":"l06","name":"The engineers' pantheon","lat":46.258389,"lng":20.15021,"radius":55,"nav":"The longest walk of the game. Aim for the tall concrete tower you can see above the trees. There is a park all the way around its base.","navAlt":"","arrive":"Walk a full circle around the base of the tower and look at the busts set around it.","kind":"number","prompt":"How many engineers are honoured around the tower?","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"7","tol":0,"hint":"Fewer than ten. Walk the whole circle — it is easy to miss one behind you.","reveal":"The Engineer Pantheon. Seven half-length portraits of Hungarian engineers, arranged around a tower that is itself the argument.\n\nOne of the seven is Szilárd Zielinsky, who designed this in 1904 — the first reinforced concrete water tower in Hungary, built entirely of concrete down to the front door. Another is János Feketeházy, who built Szeged's first road bridge. Another is Béla Zsigmondy, who drilled the artesian wells that the city still drinks from.\n\nThis city was rebuilt by engineers, and it decided to say so out loud.\n\nYou are now a good way north of the tourist centre, in an ordinary residential neighbourhood, which is the other reason this stop exists. Most visitors never come this far. The park around the tower is where the surrounding blocks actually live — dog walkers, kids, old men on benches with strong opinions.","points":15},{"id":"l07","name":"The theatre by the river","lat":46.253555,"lng":20.151954,"radius":45,"nav":"You are looking for the most ornate building on the riverside — the sort with a colonnade, statues on the roofline and a great deal of confidence.","navAlt":"Your first stop is right across town — head east, towards the river, about a kilometre. It is the longest opening walk of any team, so set off properly. When you get near the water, look for the most ornate building on the riverside.","arrive":"The steps at the front are your stage.","kind":"photo","prompt":"{{player}} and {{player}} perform a ten-second tragedy on the steps. It must have a beginning, a middle, and a death. Recruit at least one passer-by to be the audience and applaud. Photo taken mid-performance, audience visible.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"","tol":0,"hint":"Ten seconds is short. Skip the beginning.","reveal":"The National Theatre of Szeged, opened in 1883 — four years after the flood, while much of the city was still building site. It was designed by Fellner and Helmer, the Viennese firm that put near-identical theatres into dozens of cities across the empire.\n\nThat is the point of it. Putting up an opera house that early was Szeged announcing that it intended to be a proper city again, not a disaster site.\n\nTickets here cost a fraction of what the same seat costs in Vienna or Budapest, and there is usually something on midweek — opera, ballet, drama. Check the programme in the foyer as you pass. A night at the opera for the price of two beers is a genuinely absurd deal and one of the better arguments for a mid-sized city.","points":15},{"id":"l08","name":"The wheel by the old ballroom","lat":46.254385,"lng":20.153077,"radius":45,"nav":"A short walk north along the riverside promenade, no more than two hundred metres. You are heading for a playground. Ignore the grand old building beside it for now — you want the big wheel in the playground, the kind you climb inside and walk.","navAlt":"","arrive":"This is a huan hamster wheel, or mókuskerék if you want the local word for it. It turns under you, and it does not care about your dignity.","kind":"number","prompt":"{{player}} against {{player}}, head to head — or everybody in turn if you would rather. One at a time, get in and keep going as long as you can without falling or stepping out. Somebody times it. Type the best time anyone in the team managed, in seconds. There is no right answer here, so be honest. Walking counts just as much as running.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"30","tol":1000000000,"hint":"","reveal":"Whatever that number was, it is now the team record, and the only person who can take it off you is one of you.\n\nThe grand building next to the playground was the Kass Hotel, once the best address in Szeged — hotel, restaurant and ballroom in one. It was auctioned off and reopened in 1934, but the Kass family would not let the new owners keep the name, so it became the Hungária. The city promptly shortened that to Hungi, and Hungi it has been ever since.\n\nSo you have a nineteenth-century ballroom on one side and a playground wheel on the other, and the same people have been coming here to show off in front of each other for about a hundred and fifty years. The equipment changed. The behaviour did not.\n\nIt is a nightclub now, open Wednesday to Saturday from 11pm. Unfortunately, it has a long and well-documented record of turning international students away at the door, and this group should not spend an evening auditioning for a doorman. Do not worry, Szeged has plenty of bars where the only question is what you are drinking — ask your facilitators, or follow the noise off the pedestrian street.","points":15},{"id":"l09","name":"The fountain and the names of Szeged","lat":46.252281,"lng":20.152079,"radius":50,"nav":"Continue south along the river, about three hundred metres. Look for a big columned building set back behind a square, the sort that looks like it contains either a museum or a government. There is water in front of it.","navAlt":"","arrive":"The museum is the columned building. The fountain is the wet bit in front of it. You can probably see where this is going. :)","kind":"photo","prompt":"{{player}} runs across the fountain in front of the museum, one side to the other, without stopping. Everybody else photographs it while it is happening — not before, not after. Blurred is fine. Blurred is arguably better. If the fountain is dry, switched off or roped off, running around it counts instead. Dry socks are a legitimate life choice, so swap the job if you need to to another player.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"14","tol":0,"hint":"","reveal":"Filed. Your runner has earned whatever the rest of the day does to their shoes.\n\nThe building behind you is the Móra Ferenc Museum, and written across the front of the stairs are the names this city has carried since it was founded. They are plenty. Every one is a version of the same sound, written down by a different scribe in a different century, in a different language, by people who were mostly guessing. Count them if you have a minute.\n\nThe museum is named after Ferenc Móra, who ran it, and who was simultaneously a novelist, a journalist and a working archaeologist. A useful reminder for a training course that the job description you arrive with is not always the one you leave with.\n\nOpen 10 to 6, every day. Buy the full ticket rather than the cheap one — it gets you onto the roof, which is the best view of the river you will find without climbing a church. Be warned that a lot of the labelling is Hungarian-only with QR codes for translation, so bring patience and a charged phone.","points":15},{"id":"l10","name":"What the water left","lat":46.252888,"lng":20.152467,"radius":45,"nav":"Very close now — a short walk south along the promenade. Look for old brick walls and a low fragment of fortification sitting in a park, obviously much older than everything around it.","navAlt":"Your first stop is over by the river — head east, about a kilometre, until you reach the riverside promenade. Then look for old brick walls and a low fragment of fortification sitting in a park, obviously much older than everything around it.","arrive":"This is nearly all that is left of it.","kind":"photo","prompt":"{{player}} is the last brick standing. The rest of the team is the flood of 1879. Stage the moment just before the brick goes under. One photo, maximum drama. Set a timer, or get a sranger take it with the fortification in the background.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"","tol":0,"hint":"","reveal":"Szeged Castle. In March 1879 the Tisza broke through and took the city — of roughly 5,700 houses, fewer than 300 were left standing. The castle survived the water and then did not survive the rebuilding: it was pulled down, and its brick went into the new city.\n\nSo the castle is not really gone. It is in the walls around you. That is also why the pedestal under the Béla IV statue on Széchenyi Square is clad in salvaged brick.\n\nThe small museum in the surviving fragment is open 10 to 6 daily, and it is genuinely small — twenty minutes, no more. The park around it is the better find: in warm weather it works as an open-air bar and concert space, and it is one of the few places in the centre where you can sit outside without paying for the privilege.","points":15},{"id":"l11","name":"One day only","lat":46.250461,"lng":20.152017,"radius":40,"nav":"Keep going south on the embankment, towards the bridge. You are looking for a sculpture right by the water, showing something alive rather than someone important.","navAlt":"","arrive":"Look at the shapes properly before you answer — they are insects, not plants.","kind":"choice","prompt":"These insects did not start out looking like this. Before the moment the sculpture shows, they live buried in the mud of the riverbank. How long do they spend down there?","options":[{"t":"A few weeks","ok":false},{"t":"About a year","ok":false},{"t":"About three years","ok":true},{"t":"About ten years","ok":false}],"answer":"","tol":0,"hint":"Everything the sculpture shows happens in a single day. The part it does not show took about 1095 times longer.","reveal":"The Tiszavirág — the Tisza flower, which is not a flower at all but the long-tailed mayfly, Palingenia longicauda, the largest mayfly in Europe. For a few days each June they come out of the river in their millions, mate in the air above it, and are dead by nightfall. Locals call it the blooming of the Tisza.\n\nIt happens in June and if you are not here in June, you have missed it; which is either a shame or a mercy depending on how you feel about several million insects at once. What you can do instead is come back to this stretch at sunset — the light comes down the river from the west and the whole embankment turns orange for about twenty minutes. Best free thing in Szeged, and it happens every day.","points":15},{"id":"l12","name":"The poet on the promenade","lat":46.250756,"lng":20.151704,"radius":40,"nav":"Barely a minute from where you are. Another figure on the same riverside walk — a man, not an insect this time. There is a poem on the pedestal.","navAlt":"","arrive":"He has been standing here since 1957, hands in his pockets, watching the Tisza. For years he had his back to it, until somebody turned him round. The poem cut into the pedestal is his, and it is about walking along this exact riverbank.","kind":"photo","prompt":"{{player}} reads the poem on the pedestal out loud to the team, in Hungarian, with total conviction and no idea what any of it means. Somebody photographs the performance with the statue in the background. Pronunciation is not being marked. Commitment is.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"juhasz|juhász|gyula juhasz|juhasz gyula|juhász gyula|gyula juhász","tol":0,"hint":"","reveal":"Gyula Juhász, born in Szeged in 1883, dead here in 1937. He taught, worked as a journalist, and wrote about this river and this cathedral until the end.\\n\\nThe statue is by György Segesdi, 1957, and it won him the Munkácsy Prize the year after. The poem you have just performed is his Tisza, and its first line is a man walking quietly along this riverbank listening to the water — which, unless your reader did it very badly indeed, is roughly what you have just been doing.\\n\\nIf you want the Szeged that locals actually use, it is this: the riverbank. People run here, cycle here, drink here, and sit on the steps down to the water doing nothing in particular for hours. You can walk it end to end in half an hour. Do it once this week without your phone in your hand.","points":15},{"id":"l13","name":"The best team that never won it","lat":46.248574,"lng":20.151295,"radius":40,"nav":"Carry on south along the riverside park. You want a column in the grass with football boots on it and a list of names on the pedestal.","navAlt":"Your first stop is on the far side of the old town — head east, towards the river, the better part of a kilometre, then bear south along the riverside park. You want a column standing in the grass with football boots on top and a list of names on the pedestal.","arrive":"Read the pedestal. The names are in a fixed order and you want one particular position in the list.","kind":"text","prompt":"Who lead the team? Family name is enough.","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"sebes|gusztav sebes|gusztáv sebes|sebes gusztav|sebes gusztáv","tol":0,"hint":"His name is twelfth on the list on the pedestal.","reveal":"The Aranycsapat — the Golden Team. Between June 1950 and July 1954 they played thirty-one matches without losing one: four years and a month, a world record that stood for four decades. They took Olympic gold in 1952 and beat England 6–3 at Wembley in 1953, the first time England had ever lost at home to a continental side. Then they lost the 1954 World Cup final to West Germany, having beaten that same team 8–3 exactly two weeks earlier.\n\nThe coach (captain) was Gusztáv Sebes. Puskás got the fame; Sebes built the system — including the deep-lying centre forward that the rest of Europe spent a decade trying to understand.\n\nUseful this week: mention the Golden Team to any Hungarian over 50 and you will get a conversation. Mention the 1954 final and you will get a grievance. It has been seventy years and it is not settled. Whether that is tragic or magnificent is exactly the kind of thing you are here to argue about.","points":15},{"id":"l14","name":"The oldest thing here","lat":46.248604,"lng":20.148561,"radius":40,"nav":"Turn away from the river and head west, into the huge brick square with the enormous twin-towered church. In front of the church stands something much smaller and much, much older.","navAlt":"","arrive":"You want the little tower, not the cathedral. {{player}} is in charge of looking closely at it; everyone else may only offer opinions. It does not look like much. That is rather the point of what happened here.","kind":"choice","prompt":"In 1925 this tower was demolished — and something nine hundred years old turned up in the rubble. Where had it been all that time?","options":[{"t":"Buried under the square","ok":false},{"t":"Walled up inside the newer tower, encased by centuries of rebuilding","ok":true},{"t":"At the bottom of the Tisza rivel since the flood","ok":false},{"t":"Taken apart and stored in the castle","ok":false}],"answer":"1272 1931|1931 1272","tol":0,"hint":"Nobody knew it had survived. The men who found it had been sent to knock the whole thing down.","reveal":"The Dömötör Tower is Szeged's oldest building, and it only exists because everybody forgot it was there. Centuries of rebuilding walled it up inside the church that once stood here, and it stayed hidden until the demolition crews cut into it in 1925.\n\nThe two numbers on the gate are its dates. 1272 is the medieval tower. 1931 is when it was restored and turned into a baptistery, which is also when the wrought iron gate was made, full of symbols marking the stages of a human life. That it got a restoration at all was not a given — plenty of people wanted it flattened to tidy up the new square, and Ferenc Móra, whose museum is on your route, was among those who refused.\n\nThe cathedral beside it is barely a hundred years old. After the flood the city vowed that if it were rebuilt, it would raise something enormous in thanks. It was, and it did.\n\nThe cathedral is open 7am to 7pm and free to walk into, and the twin towers go up 91 metres. This square is a vast brick expanse and it gets used for everything: the open-air festival in summer, concerts on the steps at night, students sprawled across it in good weather. If you have an evening with nothing scheduled, this is a good place to end up.","points":15},{"id":"s99","name":"The finish","lat":46.247459,"lng":20.141736,"radius":45,"nav":"Last leg, and no puzzle at the end of it. Head west, past the university buildings, until you reach a small green space beside the library. Your facilitators are somewhere in it, probably checking a phone.","navAlt":"","arrive":"You made it.","kind":"none","prompt":"","options":[{"t":"","ok":true},{"t":"","ok":false}],"answer":"","tol":0,"hint":"","reveal":"Done. Fifteen stops, one city, one ring closed.\n\nWhile you wait for the others: work out which stop you would cut, and which one you would add. You are on an outdoor education course. That question is the course.","points":5}],"routes":[{"name":"Route A — Green","seq":["s00","l01","l02","l03","l04","l05","l06","l07","l08","l09","l10","l11","l12","l13","l14","l00","s99"]},{"name":"Route B — Blue","seq":["s00","l04","l05","l06","l07","l08","l09","l10","l11","l12","l13","l14","l00","l01","l02","l03","s99"]},{"name":"Route C — Amber","seq":["s00","l07","l08","l09","l10","l11","l12","l13","l14","l00","l01","l02","l03","l04","l05","l06","s99"]},{"name":"Route D — Red","seq":["s00","l10","l11","l12","l13","l14","l00","l01","l02","l03","l04","l05","l06","l07","l08","l09","s99"]},{"name":"Route E — Violet","seq":["s00","l13","l14","l00","l01","l02","l03","l04","l05","l06","l07","l08","l09","l10","l11","l12","s99"]}]};/*HUNT_END*/

function metres(la1,lo1,la2,lo2){ var R=6371000,t=Math.PI/180,dLa=(la2-la1)*t,dLo=(lo2-lo1)*t;

  var y=Math.sin((lo2-lo1)*t)*Math.cos(la2*t);
  var x=Math.cos(la1*t)*Math.sin(la2*t)-Math.sin(la1*t)*Math.cos(la2*t)*Math.cos((lo2-lo1)*t);
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
function far(d){ return d<1000?Math.round(d)+" m":(d/1000).toFixed(1)+" km"; }
function compassWord(deg){
  var w=["north","north-east","east","south-east","south","south-west","west","north-west"];
  return w[Math.round(deg/45)%8];
}
function clock(ms){ var s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  var p=function(n){return n<10?"0"+n:""+n;}; return (h?h+":"+p(m):m)+":"+p(ss); }
function fp(str){ var h=5381; for(var i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return "h"+(h>>>0).toString(36); }
function shuffleSeeded(a,seed){ var r=a.slice(),s=seed||1;
  var rnd=function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(var i=r.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)),t=r[i]; r[i]=r[j]; r[j]=t; } return r; }

/* ========== model ========== */
var KINDS = { choice:"Multiple choice", text:"Typed answer", number:"A number", photo:"Photo proof", none:"Just arrive" };
var SHORT = { choice:"choice", text:"text", number:"number", photo:"photo", none:"arrive only" };

function newStation(){
  return { id:uid(), name:"New station", lat:null, lng:null, radius:35,
    nav:"", navAlt:"", arrive:"", kind:"choice", prompt:"", options:[{t:"",ok:true},{t:"",ok:false}],
    answer:"", tol:0, hint:"", reveal:"", points:10 };
}
function blankHunt(){
  return { v:4, title:"Untitled hunt", intro:"", finish:"", accent:"#B5175C",
    minPlayers:4, maxPlayers:6, hintCost:5, askNames:true,
    stations:[newStation()], routes:[{ name:"Route A", seq:[] }] };
}
function repair(h){
  if(!h||typeof h!=="object"||!Array.isArray(h.stations)) throw new Error("bad");
  var out={ v:4, title:h.title||"Untitled hunt", intro:h.intro||"", finish:h.finish||"",
    accent:/^#[0-9a-fA-F]{6}$/.test(h.accent||"")?h.accent:"#B5175C",
    minPlayers:num(h.minPlayers,4), maxPlayers:num(h.maxPlayers,6),
    hintCost:num(h.hintCost,5), askNames:h.askNames!==false, stations:[], routes:[] };
  h.stations.forEach(function(r){
    var s=newStation(); s.id=r.id||uid();
    ["name","nav","navAlt","arrive","prompt","answer","hint","reveal","kind"].forEach(function(k){ if(r[k]!=null) s[k]=r[k]; });
    if(!KINDS[s.kind]) s.kind="none";
    ["radius","tol","points"].forEach(function(k){ if(r[k]!=null) s[k]=num(r[k],s[k]); });
    s.lat = (r.lat==null||r.lat==="")?null:num(r.lat,null);
    s.lng = (r.lng==null||r.lng==="")?null:num(r.lng,null);
    if(Array.isArray(r.options)) s.options=r.options.map(function(o){
      return typeof o==="string"?{t:o,ok:false}:{t:o.t||"",ok:!!o.ok}; });
    out.stations.push(s);
  });
  if(!out.stations.length) out.stations=[newStation()];
  var ids={}; out.stations.forEach(function(s){ ids[s.id]=1; });
  (Array.isArray(h.routes)?h.routes:[]).forEach(function(r){
    if(!r||!Array.isArray(r.seq)) return;
    out.routes.push({ name:r.name||"Route", seq:r.seq.filter(function(id){ return ids[id]; }) });
  });
  if(!out.routes.length) out.routes=[{ name:"Route A", seq:out.stations.map(function(s){return s.id;}) }];
  return out;
}
function slim(h){
  var d=newStation(), base=blankHunt();
  var o={ v:4, title:h.title, stations:[], routes:h.routes };
  ["intro","finish"].forEach(function(k){ if(h[k]) o[k]=h[k]; });
  ["accent","minPlayers","maxPlayers","hintCost"].forEach(function(k){ if(h[k]!==base[k]) o[k]=h[k]; });
  if(h.askNames===false) o.askNames=false;
  h.stations.forEach(function(s){
    var x={ id:s.id, name:s.name, lat:s.lat, lng:s.lng };
    ["nav","navAlt","arrive","prompt","answer","hint","reveal"].forEach(function(k){ if(s[k]) x[k]=s[k]; });
    if(s.kind!==d.kind) x.kind=s.kind;
    ["radius","tol","points"].forEach(function(k){ if(s[k]!==d[k]) x[k]=s[k]; });
    if(s.kind==="choice" && s.options.some(function(p){return p.t;}))
      x.options=s.options.map(function(p){ return {t:p.t,ok:p.ok?1:0}; });
    o.stations.push(x);
  });
  return o;
}

/* ========== state ========== */
var S = { screen:"home", hunt:null, stale:null, sel:0, tab:"stations", routeSel:0,
          prog:null, flash:null, testing:false, busy:false, tries:0, board:[] };
var MEDIA = {};
var LIVE = { pos:null, heading:null, watch:null, map:null, marker:null, tick:null };

/* ========== name tokens ========== */
/* Assigns every {{player}} slot in the team's route so that each name is used
   before any name repeats. Stable across refreshes because it lives in prog. */
var FIELDS=["nav","navAlt","arrive","prompt","reveal","hint"];
function buildNameSlots(){
  var p=S.prog, names=(p.players||[]).filter(function(n){ return n.trim(); });
  p.slots={};
  if(!names.length) return;
  var seq=routeSeq(), pool=shuffleSeeded(names,p.seed), k=0, cycle=pool.slice();
  seq.forEach(function(st){
    FIELDS.forEach(function(f){
      var n=(String(st[f]||"").match(/\{\{player\}\}/g)||[]).length;
      if(!n) return;
      if(!p.slots[st.id]) p.slots[st.id]={};
      p.slots[st.id][f]=[];
      for(var i=0;i<n;i++){
        if(!cycle.length) cycle=shuffleSeeded(pool,p.seed+(++k));
        p.slots[st.id][f].push(cycle.shift());
      }
    });
  });
}
function fill(text, station, field){
  if(!text) return "";
  var p=S.prog, names=(p&&p.players||[]).filter(function(n){return n.trim();});
  var per=(p&&p.slots&&station&&p.slots[station.id])||{};
  var slots=per[field]||[];
  var i=0;
  var out=String(text).replace(/\{\{player\}\}/g,function(){
    var n=slots[i++];
    if(n) return n;
    if(!names.length) return "one of you";
    return names[(fpNum(String(text))+i)%names.length];
  });
  out=out.replace(/\{\{everyone\}\}/g, names.length?listNames(names):"everyone");
  out=out.replace(/\{\{team\}\}/g, (p&&p.team)||"your team");
  return out;
}
function fpNum(t){ var h=0; for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0; return h; }
function listNames(a){
  if(a.length===1) return a[0];
  return a.slice(0,-1).join(", ")+" and "+a[a.length-1];
}
function namesUsed(){
  var p=S.prog, used={};
  Object.keys(p.slots||{}).forEach(function(id){
    if((p.done||[]).indexOf(id)<0) return;
    var per=p.slots[id]||{};
    Object.keys(per).forEach(function(f){ (per[f]||[]).forEach(function(n){ used[n]=1; }); });
  });
  return used;
}
function namesLeft(){
  var used=namesUsed();
  return (S.prog.players||[]).filter(function(n){ return n.trim() && !used[n]; });
}

/* ========== route helpers ========== */
function stationById(id){
  for(var i=0;i<S.hunt.stations.length;i++) if(S.hunt.stations[i].id===id) return S.hunt.stations[i];
  return null;
}
function routeSeq(){
  var r=S.hunt.routes[(S.prog&&S.prog.route)||0]||S.hunt.routes[0];
  return (r.seq||[]).map(stationById).filter(Boolean);
}
function current(){ var q=routeSeq(); return q[S.prog.i]||null; }

/* ========== progress ========== */
function huntKey(){ return "wp:prog:"+fp(S.hunt.stations.map(function(s){return s.id;}).join()+S.hunt.title); }
function newProgress(){

}

/* ========== boot ========== */
function paintLogos(){
  try{ Array.prototype.forEach.call(document.querySelectorAll("img[data-logo]"),
    function(el){ el.src=LOGO; }); }catch(e){}
}

function boot(){
  paintLogos();
  var hash=location.hash||"";
  var rm=hash.match(/[#&]r=(\d+)/);
  if(/[#&]play\b/.test(hash) && window.WAYPOINT_DEFAULT){
    try{
      S.hunt=repair(window.WAYPOINT_DEFAULT); accent(S.hunt.accent); S.screen="play";
      loadProgress().then(function(){
        if(rm && !S.prog.begun){ var ri=+rm[1]; if(S.hunt.routes[ri]){ S.prog.route=ri; S.prog.fixedRoute=true; } }
        render();
      });
      return;
    }catch(e){}
  }
  var m=hash.match(/[#&]h=([^&]+)/);
  if(m){
    try{
      S.hunt=repair(b64decode(m[1])); accent(S.hunt.accent); S.screen="play";
      var rm=(location.hash||"").match(/[#&]r=(\d+)/);
      loadProgress().then(function(){
        if(rm && !S.prog.begun){
          var ri=+rm[1];
          if(S.hunt.routes[ri]){ S.prog.route=ri; S.prog.fixedRoute=true; }
        }
        render();
      });
      return;
    }catch(e){ S.flash={kind:"bad",msg:"That hunt link is damaged and couldn't be opened."}; }
  }
  var draft=null;
  store.get("wp:draft").then(function(raw){ draft=raw; return store.get("wp:touched"); })
   .then(function(touched){
    if(draft && touched){ try{ S.hunt=repair(JSON.parse(draft)); }catch(e){} }
    else if(draft){ try{ S.stale=repair(JSON.parse(draft)); }catch(e){} }
    if(!S.hunt && window.WAYPOINT_DEFAULT){ try{ S.hunt=repair(window.WAYPOINT_DEFAULT); }catch(e){} }
    if(!S.hunt && S.stale){ S.hunt=S.stale; S.stale=null; }
    if(S.hunt) accent(S.hunt.accent);
    render();
  });
}
function accent(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex||"")) hex="#B5175C";
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var dk="#"+[r,g,b].map(function(c){return ("0"+Math.round(c*.78).toString(16)).slice(-2);}).join("");
  document.documentElement.style.setProperty("--accent",hex);
  document.documentElement.style.setProperty("--accent-dark",dk);
  document.documentElement.style.setProperty("--accent-tint","rgba("+r+","+g+","+b+",.13)");
}
function saveDraft(){
  if(!S.hunt) return;
  store.set("wp:draft", JSON.stringify(S.hunt));
  store.set("wp:touched","1");
}

function flashHTML(){ return S.flash?'<div class="flash '+S.flash.kind+'">'+esc(S.flash.msg)+"</div>":""; }
function stopLive(){
  if(LIVE.watch!==null){ try{ navigator.geolocation.clearWatch(LIVE.watch); }catch(e){} LIVE.watch=null; }
  if(LIVE.tick){ clearInterval(LIVE.tick); LIVE.tick=null; }
  if(LIVE.map){ try{ LIVE.map.remove(); }catch(e){} LIVE.map=null; LIVE.marker=null; }
  window.removeEventListener("deviceorientationabsolute", onHeading, true);
  window.removeEventListener("deviceorientation", onHeading, true);
}
function onHeading(e){
  var h=null;
  if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
  else if(e.absolute && e.alpha!=null) h=360-e.alpha;
  if(h==null) return;
  LIVE.heading=h;
  var n=$("#needle");
  if(n && LIVE.pos && S.prog.phase==="nav"){
    var st=current();
    if(st && st.lat!=null){
      var b=bearing(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng);
      n.style.transform="rotate("+(b-h)+"deg)";
    }
  }
}

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(LIVE.map);
      L.circle([st.lat,st.lng],{radius:st.radius,color:"#B5175C",weight:2,fillOpacity:.12}).addTo(LIVE.map);
    }catch(e){ var m=$("#map"); if(m) m.style.display="none"; }
  }else{ var mm=$("#map"); if(mm) mm.style.display="none"; }

  if(!navigator.geolocation) return;
  LIVE.watch=navigator.geolocation.watchPosition(function(pos){
    LIVE.pos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
    var d=metres(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng);
    var de=$("#dist"), dw=$("#dirword");
    if(de) de.textContent=far(d);
    if(dw) dw.textContent="Head "+compassWord(bearing(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng))+
      (LIVE.pos.acc?" · accurate to "+Math.round(LIVE.pos.acc)+" m":"");
    var n=$("#needle");
    if(n && LIVE.heading==null) n.style.transform="rotate("+bearing(LIVE.pos.lat,LIVE.pos.lng,st.lat,st.lng)+"deg)";
    if(LIVE.map){
      if(!LIVE.marker) LIVE.marker=L.circleMarker([LIVE.pos.lat,LIVE.pos.lng],{radius:7,color:"#0B2340",fillColor:"#0B2340",fillOpacity:1}).addTo(LIVE.map);
      else LIVE.marker.setLatLng([LIVE.pos.lat,LIVE.pos.lng]);
    }
  },function(){},{enableHighAccuracy:true,timeout:20000,maximumAge:5000});

  if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientationabsolute",onHeading,true);
    window.addEventListener("deviceorientation",onHeading,true);
  }
}
function checkGPS(){
  var st=current();
  if(!navigator.geolocation){ S.flash={kind:"bad",msg:"This browser can't read your location."}; S.tries=3; render(); return; }
  S.busy=true; render();
  navigator.geolocation.getCurrentPosition(function(pos){
    S.busy=false;
    var d=metres(pos.coords.latitude,pos.coords.longitude,st.lat,st.lng);
    var slack=Math.min(pos.coords.accuracy||0,25);
    if(d<=st.radius+slack){ S.tries=0; arrive(); }
    else{ S.tries++; S.flash={kind:"bad",msg:"Still about "+far(d)+" away. Keep walking."}; render(); }
  },function(err){
    S.busy=false; S.tries++;
    S.flash={kind:"bad",msg:err.code===1?"Location is blocked. Allow it for this page, then try again.":"No location fix yet — step into the open and try again."};
    render();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function arrive(){
  var st=current();
  S.prog.phase = st.kind==="none" ? "reveal" : "task";
  if(st.kind==="none") complete(st,"arrived",true);
  else { saveProgress(); render(); }
}

/* ---- answering ---- */
function complete(st,value,ok){
  var p=S.prog;
  if(p.done.indexOf(st.id)<0){
    p.done.push(st.id);
    if(ok) p.score+=num(st.points,0);
  }
  p.answers[st.id]={ v:value, ok:!!ok, t:Date.now() };
  p.phase="reveal";
  saveProgress(); render();
}
function checkAnswer(){
  var st=current(), p=S.prog;
  if(st.kind==="none"){ complete(st,"arrived",true); return; }
  var box=$("#ans"), given=box?box.value:"";
  if(!given.trim()){ S.flash={kind:"info",msg:"Put something in the box first."}; render(); return; }
  var ok=false;
  if(st.kind==="number"){
    var g=parseFloat(String(given).replace(",","."));
    ok=String(st.answer).split("|").some(function(a){
      var t=parseFloat(a); return isFinite(g)&&isFinite(t)&&Math.abs(g-t)<=num(st.tol,0);
    });
  }else ok=matches(given,st.answer);
  if(ok) complete(st,given,true);
  else{ S.flash={kind:"bad",msg:"Not it. Look again — you can't move on until this is right."}; render(); }
}
function pickChoice(i){
  var st=current(), opts=st.options.filter(function(o){return o.t;});
  var o=opts[i];
  if(o&&o.ok) complete(st,o.t,true);
  else{ S.flash={kind:"bad",msg:"Not that one. Try again."}; render(); }
}
function useHint(){
  var st=current(), p=S.prog;
  if(p.hinted.indexOf(st.id)<0){ p.hinted.push(st.id); p.score=Math.max(0,p.score-num(S.hunt.hintCost,0)); }
  S.flash={kind:"info",msg:fill(st.hint,st,"hint")};
  saveProgress(); render();
}
function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1100, w=img.width, hgt=img.height;
      if(Math.max(w,hgt)>max){ var k=max/Math.max(w,hgt); w=Math.round(w*k); hgt=Math.round(hgt*k); }
      var c=document.createElement("canvas"); c.width=w; c.height=hgt;
      c.getContext("2d").drawImage(img,0,0,w,hgt);
      cb(c.toDataURL("image/jpeg",0.7));
    };
    img.onerror=function(){ cb(null); };
    img.src=r.result;
  };
  r.onerror=function(){ cb(null); };
  r.readAsDataURL(file);
}

function drawQR(el,text,size){
  if(!el) return;
  el.innerHTML="";
  if(typeof QRCode==="undefined"){ el.innerHTML='<p class="tiny">QR codes need a connection when the page loads.</p>'; return; }
  if(text.length>1100){ el.innerHTML='<p class="tiny" style="max-width:32ch;text-align:center">Too much hunt to fit in a QR code — send the link instead.</p>'; return; }
  try{ new QRCode(el,{text:text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ el.innerHTML='<p class="tiny">Too long for a QR code.</p>'; }
}

document.addEventListener("click",function(e){

  if((t=e.target.closest("[data-tab]"))){ S.tab=t.getAttribute("data-tab"); render(); return; }

  if((t=e.target.closest("[data-pick]"))){ pickChoice(+t.getAttribute("data-pick")); return; }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act"), i=+b.getAttribute("data-i");
  var h=S.hunt, r=h&&h.routes[S.routeSel];

  if(a==="gopublish"){ S.screen="build"; S.tab="share"; render(); return; }
  if(a==="usestale"){
    S.hunt=S.stale; S.stale=null; accent(S.hunt.accent);
    S.sel=0; S.routeSel=0; S.tab="stations"; saveDraft(); S.screen="build"; render(); return;
  }
  if(a==="restore"){
    if(!confirm("Replace what is in this browser with the game built into the file?")) return;
    S.hunt=repair(window.WAYPOINT_DEFAULT); accent(S.hunt.accent);
    S.sel=0; S.routeSel=0; S.tab="stations"; saveDraft();
    S.screen="build"; render(); return;
  }
  if(a==="new"){ S.hunt=blankHunt(); accent(S.hunt.accent); S.screen="build"; S.tab="stations"; S.sel=0; saveDraft(); render(); }
  else if(a==="resume"){ S.screen="build"; S.tab="stations"; S.sel=0; render(); }
  else if(a==="home"){ S.screen="home"; S.testing=false; render(); }
  else if(a==="board"){ S.screen="board"; render(); }
  else if(a==="import") importFile();
  else if(a==="export") download((h.title||"hunt").replace(/[^\w\- ]+/g,"").slice(0,40)+".json", JSON.stringify(h,null,2));
  else if(a==="wipe"){ if(confirm("Throw this hunt away and start blank?")){ S.hunt=blankHunt(); S.sel=0; saveDraft(); render(); } }
  else if(a==="addstation"){ h.stations.push(newStation()); S.sel=h.stations.length-1; saveDraft(); render(); }
  else if(a==="del"){
    if(h.stations.length===1){ alert("A hunt needs at least one station."); return; }
    if(!confirm("Delete this station? It will be removed from every route too.")) return;
    var id=h.stations[S.sel].id;
    h.stations.splice(S.sel,1);
    h.routes.forEach(function(x){ x.seq=x.seq.filter(function(y){ return y!==id; }); });
    S.sel=Math.max(0,S.sel-1); saveDraft(); render();
  }
  else if(a==="dupe"){ var c=JSON.parse(JSON.stringify(h.stations[S.sel])); c.id=uid(); c.name+=" (copy)";
    h.stations.splice(S.sel+1,0,c); S.sel++; saveDraft(); render(); }
  else if(a==="up"||a==="down"){
    var j=a==="up"?S.sel-1:S.sel+1; if(j<0||j>=h.stations.length) return;
    var tmp=h.stations[S.sel]; h.stations[S.sel]=h.stations[j]; h.stations[j]=tmp; S.sel=j; saveDraft(); render();
  }
  else if(a==="addopt"){ h.stations[S.sel].options.push({t:"",ok:false}); saveDraft(); render(); }
  else if(a==="delopt"){ h.stations[S.sel].options.splice(i,1); saveDraft(); render(); }
  else if(a==="here"){
    if(!navigator.geolocation){ alert("No location available in this browser."); return; }
    b.textContent="Finding…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var s=h.stations[S.sel];
      s.lat=+pos.coords.latitude.toFixed(6); s.lng=+pos.coords.longitude.toFixed(6);
      saveDraft(); render();
    },function(){ alert("No fix. Go outside and allow location for this page."); render(); },{enableHighAccuracy:true,timeout:15000});
  }
  else if(a==="addroute"){ h.routes.push({name:"Route "+String.fromCharCode(65+h.routes.length),seq:[]}); S.routeSel=h.routes.length-1; saveDraft(); render(); }
  else if(a==="delroute"){ if(h.routes.length===1){ alert("Keep at least one route."); return; }
    h.routes.splice(S.routeSel,1); S.routeSel=0; saveDraft(); render(); }
  else if(a==="raddst"){ var sel=$("#addst"); if(sel&&r){ r.seq.push(sel.value); saveDraft(); render(); } }
  else if(a==="rdel"){ r.seq.splice(i,1); saveDraft(); render(); }
  else if(a==="rup"||a==="rdown"){
    var k=a==="rup"?i-1:i+1; if(k<0||k>=r.seq.length) return;
    var q=r.seq[i]; r.seq[i]=r.seq[k]; r.seq[k]=q; saveDraft(); render();
  }
  else if(a==="rotate"){ rotateRoutes(); }
  else if(a==="copyshort"||a==="copylink"){
    var url=a==="copyshort"?shortURL(i):shareURL(i);
    var was=b.textContent;
    var done=function(){ b.textContent="Copied"; setTimeout(function(){ b.textContent=was; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,function(){ prompt("Copy:",url); });
    else prompt("Copy:",url);
  }
  else if(a==="rebake") rebake();
  else if(a==="sheet"){
    download((S.hunt.title||"hunt").replace(/[^\w\- ]+/g,"").slice(0,40)+" facilitator sheet.html", buildSheet(), "text/html");
  }
  else if(a==="testplay"){ S.testing=true; S.screen="play"; S.prog=newProgress(); MEDIA={}; render(); }
  else if(a==="backtobuild"){ S.testing=false; S.screen="build"; render(); }
  else if(a==="begin") beginGame();
  else if(a==="checkgps") checkGPS();
  else if(a==="override"){
    var st=current(); S.prog.overrides.push(st.id); S.tries=0; arrive();
  }
  else if(a==="arrived") arrive();
  else if(a==="check") checkAnswer();
  else if(a==="hint") useHint();
  else if(a==="submitphoto"){ var s2=current(); if(MEDIA[s2.id]) complete(s2,"photo submitted",true); }
  else if(a==="next"){
    S.prog.i++; S.prog.phase="nav"; S.tries=0; saveProgress(); render();
  }
  else if(a==="report"){ download((S.prog.team||"team").replace(/[^\w\- ]+/g,"")+" results.html", buildReport(), "text/html"); }
  else if(a==="copyresult"){
    var code=resultCode();
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(
      function(){ b.textContent="Copied — send it to your facilitator"; },function(){ prompt("Copy this:",code); });
    else prompt("Copy this:",code);
  }
  else if(a==="addcode"){
    var el=$("#code");
    try{ var d=b64decode(el.value.trim()); S.board.push(d); S.flash={kind:"good",msg:"Added "+(d.t||"team")+"."}; }
    catch(err){ S.flash={kind:"bad",msg:"That code didn't decode. Ask them to copy it again."}; }
    render();
  }
  else if(a==="clearboard"){ if(confirm("Clear the scoreboard?")){ S.board=[]; render(); } }
  else if(a==="resetprog"){
    if(!confirm("Wipe this team's progress and start the hunt again?")) return;
    S.prog=newProgress(); MEDIA={}; saveProgress(); saveMedia(); render();
  }
});

function beginGame(){
  var h=S.hunt, p=S.prog;
  var team=$("#team"), names=[].slice.call(document.querySelectorAll(".pname")).map(function(x){ return x.value.trim(); });
  var picked=document.querySelector('input[name="route"]:checked');
  p.route = picked?+picked.value:(p.route||0);
  p.team = team?team.value.trim():"";
  p.players = names.filter(function(n){ return n; });
  if(!p.team){ S.flash={kind:"bad",msg:"Give the team a name first."}; render(); return; }
  if(h.askNames && p.players.length<h.minPlayers){
    S.flash={kind:"bad",msg:"This game needs at least "+h.minPlayers+" names."}; render(); return;
  }
  p.begun=true; p.started=Date.now(); p.phase="nav"; p.i=0;
  buildNameSlots();
  saveProgress(); render();
}

function rotateRoutes(){
  var h=S.hunt, base=h.routes[S.routeSel];
  if(!base||base.seq.length<3){ alert("Build one full route first, then rotate it."); return; }
  var n=Math.max(2,Math.min(12,+($("#nrot").value)||5));
  var pin=$("#pinends").value;
  var first=pin!=="none"?base.seq[0]:null;
  var last=pin==="both"?base.seq[base.seq.length-1]:null;
  var mid=base.seq.slice(first?1:0, last?base.seq.length-1:base.seq.length);
  var out=[];
  for(var k=0;k<n;k++){
    var off=Math.round(k*mid.length/n);
    var dir=k%2===0?1:-1;
    var seq=[];
    for(var i=0;i<mid.length;i++){
      var idx=((off+dir*i)%mid.length+mid.length)%mid.length;
      seq.push(mid[idx]);
    }
    out.push({ name:"Route "+String.fromCharCode(65+k), seq:(first?[first]:[]).concat(seq, last?[last]:[]) });
  }
  h.routes=out; S.routeSel=0; saveDraft(); render();
}

function importFile(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        S.hunt=repair(JSON.parse(rd.result)); accent(S.hunt.accent);
        S.screen="build"; S.tab="stations"; S.sel=0; S.routeSel=0;
        S.flash={kind:"good",msg:"Hunt opened."}; saveDraft(); render();
      }catch(e){ S.flash={kind:"bad",msg:"That file isn't a Wild Goose hunt."}; render(); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ===== export: a ready-to-host copy, and the facilitator sheet ===== */
function stationLabel(i){
  var h=S.hunt, id=h.stations[i].id;
  var everyFirst=h.routes.length&&h.routes.every(function(r){ return r.seq[0]===id; });
  var everyLast =h.routes.length&&h.routes.every(function(r){ return r.seq[r.seq.length-1]===id; });
  if(everyFirst) return "START";
  if(everyLast)  return "FINISH";
  var n=0;
  for(var k=0;k<=i;k++){
    var kid=h.stations[k].id;
    var kf=h.routes.length&&h.routes.every(function(r){ return r.seq[0]===kid; });
    var kl=h.routes.length&&h.routes.every(function(r){ return r.seq[r.seq.length-1]===kid; });
    if(!kf&&!kl) n++;
  }
  return "S"+n;
}
function labelOf(id){
  for(var i=0;i<S.hunt.stations.length;i++) if(S.hunt.stations[i].id===id) return stationLabel(i);
  return "?";
}
/* Google Maps allows ten stops per set of directions, so chunk with a one-stop overlap */
function mapLinks(seq){
  var st=seq.map(stationById).filter(function(s){ return s&&s.lat!=null; });
  var out=[], i=0;
  while(i<st.length-1){
    var chunk=st.slice(i,i+10);
    if(chunk.length<2) break;
    var u="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+chunk[0].lat+","+chunk[0].lng+
          "&destination="+chunk[chunk.length-1].lat+","+chunk[chunk.length-1].lng;
    var w=chunk.slice(1,-1);
    if(w.length) u+="&waypoints="+w.map(function(s){ return s.lat+","+s.lng; }).join("%7C");
    out.push({ from:i+1, to:i+chunk.length, url:u });
    i+=chunk.length-1;
  }
  return out;
}
function answerText(s){
  if(s.kind==="choice"){ var o=s.options.filter(function(x){return x.ok&&x.t;})[0]; return o?o.t:"—"; }
  if(s.kind==="number") return s.answer+(s.tol?" (accept ±"+s.tol+")":"");
  if(s.kind==="text"){ var a=String(s.answer).split("|");
    return a[0]+(a.length>1?"   [also accepts: "+a.slice(1).join(", ")+"]":""); }
  if(s.kind==="photo") return "Photo — always accepted, review it afterwards";
  return "Nothing to answer";
}
function buildSheet(){
  var h=S.hunt, n=h.routes.length?h.routes[0].seq.length:0;
  var grid="";
  if(h.routes.length){
    grid='<table><tr><th>Step</th>'+h.routes.map(function(r){return "<th>"+esc(r.name)+"</th>";}).join("")+"</tr>";
    for(var i=0;i<n;i++){
      grid+='<tr><td class=step>'+(i+1)+"</td>"+h.routes.map(function(r){
        var s=stationById(r.seq[i]);
        return "<td><b>"+(s?labelOf(s.id):"—")+"</b> "+esc(s?s.name:"")+"</td>";
      }).join("")+"</tr>";
    }
    grid+="</table>";
  }
  var blocks=h.routes.map(function(r){
    var tot=0, rows="";
    r.seq.forEach(function(id,i){

      if(i<r.seq.length-1){ var nx=stationById(r.seq[i+1]);
        if(nx&&s.lat!=null&&nx.lat!=null){ var d=metres(s.lat,s.lng,nx.lat,nx.lng)*1.25; tot+=d; leg=Math.round(d)+" m"; } }
      rows+='<tr><td class=step>'+(i+1)+"</td><td><b>"+labelOf(id)+"</b></td><td>"+esc(s.name)+
        "</td><td>"+esc(KINDS[s.kind])+'</td><td class=num>'+leg+"</td></tr>";
    });
    var links=mapLinks(r.seq).map(function(l){
      return '<a class=maplink target=_blank rel=noopener href="'+l.url+'">Stops '+l.from+"–"+l.to+" in Google Maps</a>";
    }).join("");
    var first=stationById(r.seq[1])||stationById(r.seq[0]);
    var open=first?(first.navAlt||first.nav):"";
    return "<h3 class=rh>"+esc(r.name)+"</h3>"+
      '<p class=meta>'+(tot/1000).toFixed(1)+" km on foot · starts at "+esc(first?first.name:"")+"</p>"+

      '<table class=rt><tr><th>Step</th><th>Ref</th><th>Station</th><th>Type</th><th>To next</th></tr>'+rows+"</table>";
  }).join("");
  var cards=h.stations.map(function(s,i){

      (s.lat==null?"":' · <a target=_blank rel=noopener href="https://www.google.com/maps/search/?api=1&query='+s.lat+","+s.lng+'">Google Maps</a>'+
        ' · <a target=_blank rel=noopener href="https://www.openstreetmap.org/?mlat='+s.lat+"&mlon="+s.lng+"#map=18/"+s.lat+"/"+s.lng+'">OSM</a>')+
      "</p>"+
      (s.nav?'<p><span class=k>Walking clue</span> '+esc(s.nav)+"</p>":"")+
      (s.navAlt?'<p><span class=k>If first stop</span> '+esc(s.navAlt)+"</p>":"")+
      (s.prompt?'<p><span class=k>Task</span> '+esc(s.prompt)+"</p>":"")+
      '<p><span class=k>Answer</span> <b class=ans>'+esc(answerText(s))+"</b></p>"+
      (s.hint?'<p><span class=k>Hint (−'+h.hintCost+")</span> "+esc(s.hint)+"</p>":"")+
      "</section>";
  }).join("");
  return "<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>"+
    "<title>"+esc(h.title)+" — facilitator sheet</title><style>"+
    "body{font-family:system-ui,-apple-system,sans-serif;max-width:1000px;margin:26px auto;padding:0 18px;color:#0B2340;line-height:1.45}"+
    "h1{margin:0 0 4px;font-size:1.7rem}h2{margin:32px 0 8px;font-size:1.15rem;border-bottom:2px solid #0B2340;padding-bottom:4px}"+
    "h3{margin:16px 0 3px;font-size:1rem}h3.rh{margin-top:26px;font-size:1.1rem;color:#B5175C}"+
    "table{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:8px}"+
    "th,td{border:1px solid #C7D2DA;padding:4px 6px;text-align:left;vertical-align:top}th{background:#D3E3DE}"+
    "td.step{background:#F3F6F5;text-align:center;font-weight:700;width:3em}td.num{text-align:right;color:#3F5D77}"+
    "table.rt{max-width:660px}section{border-bottom:1px solid #eee;padding-bottom:10px;break-inside:avoid}"+
    ".meta{color:#3F5D77;font-size:.83rem;margin:2px 0 6px}p{margin:4px 0}"+

    ".links{margin:8px 0 2px}a.maplink{display:inline-block;margin:0 8px 6px 0;padding:6px 11px;border:1.5px solid #B5175C;"+
    "border-radius:3px;color:#B5175C;text-decoration:none;font-size:.82rem;font-weight:600}a.maplink:hover{background:#F6E3EC}"+
    "@media print{body{margin:0;font-size:10pt}h2{page-break-after:avoid}a.maplink{border:none;padding:0}}"+
    "img.brand{height:60px;width:auto;margin:0 0 10px}"+
    "</style></head><body>"+
    '<img class="brand" src="'+LOGO+'" alt="">'+
    "<h1>"+esc(h.title)+" — facilitator sheet</h1>"+

    (blocks?"<h2>Route by route, with maps</h2><p>Google Maps allows ten stops per set of directions, so long routes come as several links that overlap by one stop.</p>"+blocks:"")+
    "<h2>Every station</h2>"+cards+"</body></html>";
}
function rebake(){
  var name=(S.hunt.title||"hunt").replace(/[^\w\- ]+/g,"").slice(0,40);
  var M1="/*HUNT_"+"START*/", M2="/*HUNT_"+"END*/";
  var json=JSON.stringify(S.hunt).replace(/<\/script/gi,"<\\/script");
  function bake(txt){
    if(!txt) return null;
    var a=txt.indexOf(M1), b=txt.indexOf(M2);
    if(a<0||b<0) return null;
    return txt.slice(0,a)+M1+"window.WAYPOINT_DEFAULT = "+json+";"+txt.slice(b);
  }
  /* the page keeps a pristine copy of itself taken before it drew anything,
     so this works offline, from a hard drive, and inside preview frames */
  var out=bake(PRISTINE);
  if(out){
    download(name+".html", out, "text/html");
    S.flash={kind:"good",msg:"Downloaded. Rename it to index.html and upload it over the one on your host — every team link will then serve this version."};
    render(); return;
  }
  fetch(location.href,{cache:"no-store"}).then(function(r){ return r.text(); }).then(function(txt){
    var o=bake(txt);
    if(!o) throw new Error("markers");
    download(name+".html", o, "text/html");
    S.flash={kind:"good",msg:"Downloaded. Rename it to index.html and upload it over the one on your host."};
    render();
  }).catch(function(){
    S.flash={kind:"bad",msg:"Could not rebuild the file in this browser. Use Download hunt file instead and send the .json on."};
    render();
  });
}


var PRISTINE="";
try{ PRISTINE="<!DOCTYPE html>\n"+document.documentElement.outerHTML; }catch(e){}

boot();
})();

</script></body></html>
